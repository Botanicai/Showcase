name: BotanicAI Showcase Bot

on:
  repository_dispatch:
    types: [webhook]
  workflow_dispatch:

jobs:
  handle-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run bot handler
        run: python main.py
        env:
          MAX_API_TOKEN: ${{ secrets.MAX_API_TOKEN }}
